<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5d4b">
  <title>Gabay OFW</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="auth-loading" class="centered-state" aria-live="polite">
    <div class="shell-skeleton" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <p data-copy="loading"></p>
  </div>

  <main id="signed-out" class="auth-page hidden">
    <section class="welcome-panel">
      <div class="welcome-nav">
        <a class="brand" href="/" data-copy-aria="homeLabel">
          <span class="brand-mark">G</span>
          <span>Gabay OFW</span>
        </a>
        <label class="language-control">
          <span class="sr-only" data-copy="languageLabel"></span>
          <select class="language-select" data-copy-aria="languageLabel"></select>
        </label>
      </div>
      <div class="welcome-copy">
        <p class="eyebrow" data-copy="welcomeEyebrow"></p>
        <h1 data-copy="welcomeTitle"></h1>
        <p class="lead" data-copy="welcomeBody"></p>
        <button class="button primary" id="signin" type="button" data-copy="signIn"></button>
        <p class="fine-print" data-copy="privacyNote"></p>
      </div>
    </section>
    <aside class="welcome-context" data-copy-aria="serviceOverview">
      <div>
        <p class="context-number">1348</p>
        <p data-copy="owwaAlways"></p>
      </div>
    </aside>
  </main>

  <div id="signed-in" class="app hidden">
    <header class="topbar">
      <button class="brand brand-button" type="button" data-action="dashboard">
        <span class="brand-mark">G</span>
        <span>Gabay OFW</span>
      </button>
      <nav class="topbar-actions" data-copy-aria="accountControls">
        <label class="language-control">
          <span class="sr-only" data-copy="languageLabel"></span>
          <select class="language-select" data-copy-aria="languageLabel"></select>
        </label>
        <button class="button quiet" type="button" data-action="profile" data-copy="profile"></button>
        <button class="button quiet" id="signout" type="button" data-copy="signOut"></button>
      </nav>
    </header>

    <div id="screen-loading" class="screen-loading hidden" aria-live="polite">
      <div class="content-skeleton" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p data-copy="loading"></p>
    </div>

    <main id="screen" tabindex="-1"></main>

    <button id="global-help" class="global-help" type="button" data-action="crisis" data-copy="needHelp"></button>
  </div>

  <dialog id="first-run-dialog" class="disclaimer-dialog">
    <form method="dialog">
      <div class="dialog-mark">G</div>
      <h2 data-copy="disclaimerTitle"></h2>
      <p data-copy="disclaimerBody"></p>
      <div class="notice-list">
        <p><strong data-copy="notLegalTitle"></strong> <span data-copy="notLegalBody"></span></p>
        <p><strong data-copy="notEmergencyTitle"></strong> <span data-copy="notEmergencyBody"></span></p>
      </div>
      <div class="dialog-actions">
        <button class="button primary full-width" id="accept-disclaimer" value="default" data-copy="understand"></button>
        <button class="button full-width" id="disclaimer-help" value="help" data-copy="needHelp"></button>
      </div>
    </form>
  </dialog>

  <div id="status" class="toast hidden" role="status" aria-live="polite"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
