<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
  <title>Gabay OFW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="auth-loading" class="centered-state" aria-live="polite">
    <div class="loading-brand" aria-hidden="true">
      <span class="brand-dot"></span>
      <strong>Gabay OFW</strong>
    </div>
    <div class="dawn-loader" aria-hidden="true"><span></span><span></span><span></span></div>
    <p data-copy="loading"></p>
  </div>

  <!-- Signed-out / welcome (issue #71, design-fidelity follow-up): one
       centred column on the near-white ground with the flag glow behind
       it — the question, the sign-in card, then the three orienting
       steps kept quiet below. No hotline number appears here: routing
       numbers are code-owned and resolved server-side (ADR-0002), and a
       signed-out visitor cannot reach the zero-model emergency card. -->
  <main id="signed-out" class="auth-page hidden">
    <div class="ph-glow" aria-hidden="true"></div>
    <nav class="welcome-nav">
      <a class="brand" href="/" data-copy-aria="homeLabel">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Gabay OFW</span>
      </a>
      <label class="language-control">
        <span class="sr-only" data-copy="languageLabel"></span>
        <select class="language-select" data-copy-aria="languageLabel"></select>
      </label>
    </nav>

    <section class="welcome-layout">
      <div class="welcome-copy">
        <h1 data-copy="welcomeTitle"></h1>
        <p class="lead" data-copy="welcomeBody"></p>
      </div>
      <div class="welcome-actions">
        <section class="signin-card">
          <h2 data-copy="startNow"></h2>
          <p data-copy="signInBody"></p>
          <button class="google-button" id="signin" type="button">
            <span class="google-mark" aria-hidden="true">G</span>
            <span data-copy="signIn"></span>
          </button>
          <p class="trust-line">
            <span data-copy="trustFree"></span>
            <span aria-hidden="true">·</span>
            <span data-copy="trustPrivate"></span>
            <span aria-hidden="true">·</span>
            <span data-copy="trustNoAds"></span>
          </p>
        </section>
        <ol class="welcome-steps">
          <li><span>1</span><p data-copy="welcomeStepOne"></p></li>
          <li><span>2</span><p data-copy="welcomeStepTwo"></p></li>
          <li><span>3</span><p data-copy="welcomeStepThree"></p></li>
        </ol>
      </div>
    </section>
  </main>

  <div id="signed-in" class="app hidden">
    <!-- EMERGENCY (issue #41, #64): always reachable regardless of screen,
         because #emergency-controls lives outside #screen's per-route
         templates. Renders POST /api/emergency/button's cached action
         card with zero model calls, so it works even when chat/model is
         down. It is FIRST in the DOM and reachable by a skip link, so a
         keyboard or screen-reader user in a crisis hits it before any
         screen content — the fixed top-right position is unchanged.
         "Mark safe" only appears once the Imminent Danger predicate
         (case.emergency.active) is on. -->
    <a class="skip-link" href="#emergency-button" data-copy="skipToEmergency"></a>
    <div id="emergency-controls" class="emergency-controls" role="region" data-copy-aria="emergencyRegion">
      <button id="emergency-button" class="emergency-button" type="button" data-action="emergency-button">
        <span class="urgent-dot" aria-hidden="true"></span>
        <span data-copy="emergencyButton"></span>
      </button>
      <button id="mark-safe-button" class="mark-safe-button hidden" type="button" data-action="mark-safe">
        <span data-copy="markSafeButton"></span>
      </button>
    </div>

    <!-- Mobile only (<=900px): the rail is an off-canvas drawer, opened
         from this bar — a burger + wordmark, Gemini-style. On wider
         screens the rail is always visible and this bar is display:none. -->
    <div class="mobile-topbar">
      <button class="topbar-menu" type="button" data-action="toggle-rail" aria-expanded="false" data-copy-aria="menuLabel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="topbar-brand brand" type="button" data-action="home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Gabay OFW</span>
      </button>
    </div>
    <div class="rail-scrim" data-action="close-rail" aria-hidden="true"></div>

    <!-- The left rail (issue #71 as revised): brand, the Conversation
         list (#72), and account controls. Always visible on wide
         screens; an off-canvas drawer on a phone (opened from the burger
         above). A flat panel one shade off the page — separation is the
         ground colour, never a line or shadow. The right-hand Case panel
         is gone — "what Gabay knows" folds into the thread. Never
         "check": CONTEXT.md reserves that word for the verb Gabay
         performs inside a Conversation. -->
    <aside class="rail" id="rail" aria-label="Gabay OFW navigation">
      <button class="rail-close" type="button" data-action="close-rail" data-copy-aria="closeLabel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="brand rail-brand" type="button" data-action="home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Gabay OFW</span>
      </button>

      <!-- "New conversation" is the rail's primary action, so it leads —
           above the list it starts, not buried under its heading. It only
           clears the screen; the row appears once she sends a message
           (issue #72). -->
      <nav class="rail-nav" data-copy-aria="conversationsNavigation">
        <button class="rail-new-conversation" type="button" data-action="new-conversation" data-copy-aria="newConversation">
          <span class="rail-control-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M18.4 2.6a2.12 2.12 0 0 1 3 3L13 14l-4 1 1-4 8.4-8.4Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span data-copy="newConversation"></span>
        </button>
        <p class="rail-heading" data-copy="conversationsHeading"></p>
        <!-- Rendered from GET /api/conversations by renderRail() in
             app.js, most-recent first. Scrolls within the rail; the
             footer stays pinned. -->
        <div id="rail-conversations-list" class="rail-conversations-list"></div>
      </nav>

      <div class="rail-footer">
        <label class="language-control rail-control">
          <span class="rail-control-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.4 3.8 5.6 3.8 9S14.5 27.6 12 21M12 3C9.5 5.4 8.2 8.6 8.2 12S9.5 18.6 12 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="sr-only" data-copy="languageLabel"></span>
          <select class="language-select" data-copy-aria="languageLabel"></select>
          <span class="rail-control-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </label>
        <button class="rail-control avatar-button" type="button" data-action="profile" data-copy-aria="profile">
          <span id="avatar-initial" aria-hidden="true">M</span>
          <span id="account-name" class="account-name"></span>
        </button>
        <button class="rail-control text-button" id="signout" type="button" data-copy-aria="signOut">
          <span class="rail-control-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8M16 12H9M16 12l-3-3M16 12l-3 3M20 12h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span data-copy="signOut"></span>
        </button>
      </div>
    </aside>

    <div id="screen-loading" class="screen-loading hidden" aria-live="polite">
      <div class="content-skeleton" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p data-copy="loading"></p>
    </div>

    <main id="screen" tabindex="-1"></main>
  </div>

  <dialog id="first-run-dialog" class="disclaimer-dialog" aria-labelledby="first-run-title">
    <form method="dialog">
      <span class="dialog-symbol" aria-hidden="true">G</span>
      <h2 id="first-run-title" data-copy="disclaimerTitle"></h2>
      <p data-copy="disclaimerBody"></p>
      <div class="notice-list">
        <p><strong data-copy="notLegalTitle"></strong> <span data-copy="notLegalBody"></span></p>
        <p><strong data-copy="notEmergencyTitle"></strong> <span data-copy="notEmergencyBody"></span></p>
      </div>
      <div class="dialog-actions">
        <button class="button ink-button full-width" id="accept-disclaimer" value="default" data-copy="understand"></button>
        <!-- EMERGENCY must stay reachable even before the disclaimer is
             dismissed (issue #64: "a visible, always-reachable EMERGENCY
             button") — showModal() makes the rest of the page inert, so
             the escape hatch has to live inside the dialog itself. -->
        <button class="button emergency-button full-width" type="button" data-action="emergency-button" data-copy="emergencyButton"></button>
      </div>
    </form>
  </dialog>

  <!-- One authenticated tap, with a second confirming tap so a pocket-tap
       (phone held by someone else) can't clear the predicate by accident
       (PRD #34 user story 32). mark_safe clears the predicate only, never
       the safety flag — see app/case.py:mark_safe. -->
  <dialog id="mark-safe-dialog" class="disclaimer-dialog" aria-labelledby="mark-safe-title">
    <form method="dialog">
      <h2 id="mark-safe-title" data-copy="markSafeConfirmTitle"></h2>
      <p data-copy="markSafeConfirmBody"></p>
      <div class="dialog-actions">
        <button class="button urgent-button full-width" type="button" data-action="mark-safe-confirm" data-copy="markSafeConfirm"></button>
        <button class="button full-width" type="button" data-action="mark-safe-cancel" data-copy="markSafeCancel"></button>
      </div>
    </form>
  </dialog>

  <!-- Deleting a Conversation removes that transcript and nothing else
       (issue #72, ADR-0007 amendment). The copy must say so plainly
       before she confirms — her Case and the real "delete everything"
       are separate. -->
  <dialog id="delete-conversation-dialog" class="disclaimer-dialog" aria-labelledby="delete-conversation-title">
    <form method="dialog">
      <h2 id="delete-conversation-title" data-copy="deleteConversationTitle"></h2>
      <p data-copy="deleteConversationBody"></p>
      <div class="dialog-actions">
        <button class="button full-width delete-confirm-button" type="button" data-action="delete-conversation-confirm" data-copy="deleteConversationConfirm"></button>
        <button class="button text-button full-width" type="button" data-action="delete-conversation-cancel" data-copy="deleteConversationCancel" autofocus></button>
      </div>
    </form>
  </dialog>

  <div id="status" class="toast hidden" role="status" aria-live="polite"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
