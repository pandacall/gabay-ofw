name: Test and deploy Cloud Run

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # Node is needed here (moved up from below) so `npx firebase-tools`
      # can wrap the backend test run in the Firestore emulator declared
      # in firebase.json — without it, tests/test_firestore_session_service.py
      # is gated on FIRESTORE_EMULATOR_HOST and silently skips (issue #70).
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Run backend tests
        # emulators:exec sets FIRESTORE_EMULATOR_HOST for the wrapped
        # command and propagates the command's exit code, so a test
        # failure still fails the workflow rather than being swallowed.
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-gabay-ofw "python -m pytest tests -q"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm run test:ui

  deploy:
    name: Deploy production
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        id: deploy
        shell: bash
        run: |
          # --min-instances=1 (issue #49): keeps one instance warm so a judge's
          # first request never pays a 10-20s cold-start before the first
          # token. Set on every deploy so it survives a revision rollback that
          # predates this change.
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --labels dev-tutorial=cloud-run-ai-challenge \
            --min-instances=1 \
            --quiet

          service_url="$(
            gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" \
              --format='value(status.url)'
          )"
          echo "url=${service_url}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed service
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/api/health"
