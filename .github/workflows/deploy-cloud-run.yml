name: Test and deploy Cloud Run

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm run test:ui

  deploy:
    name: Deploy production
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        id: deploy
        shell: bash
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --labels dev-tutorial=cloud-run-ai-challenge \
            --quiet

          service_url="$(
            gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" \
              --format='value(status.url)'
          )"
          echo "url=${service_url}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed service
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/api/health"
