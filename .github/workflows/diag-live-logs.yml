name: Diagnose live Contract Check failure

# Temporary, manually-triggered diagnostic: reads Cloud Logging for a single
# request_id already surfaced to the user by the deployed error toast.
# Prints only the app's own privacy-safe diagnostic line (exception category
# and provider/persistence status code) -- never prompt or model content,
# since the app never logs those.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "The Reference ID shown in the Contract Check error toast"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  read-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Read matching log entries
        id: logs
        shell: bash
        continue-on-error: true
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision"
             AND resource.labels.service_name="${{ vars.CLOUD_RUN_SERVICE }}"
             AND SEARCH("${{ inputs.request_id }}")' \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --freshness=1d \
            --limit=20 \
            --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload)'

      - name: Check Secret Manager access (no secret value printed)
        id: secret_check
        continue-on-error: true
        shell: bash
        run: |
          gcloud secrets versions access latest --secret=gemini-api-key \
            --project "${{ vars.GCP_PROJECT_ID }}" > /tmp/key.txt
          echo "length=$(wc -c < /tmp/key.txt)" >> "$GITHUB_OUTPUT"
          shred -u /tmp/key.txt 2>/dev/null || rm -f /tmp/key.txt

      - name: Set up Python
        if: steps.secret_check.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Reproduce provider failure category (no key/content printed)
        if: steps.secret_check.outcome == 'success'
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          pip install -q -r requirements.txt
          GEMINI_API_KEY="$(gcloud secrets versions access latest --secret=gemini-api-key --project "$GCP_PROJECT_ID")" \
          python - <<'PY'
          import asyncio
          import os

          from google.adk.models.google_llm import Gemini
          from google.genai import Client
          from google.genai import types

          async def main():
              client = Client(api_key=os.environ["GEMINI_API_KEY"])
              model = Gemini(model="gemini-2.5-flash", client=client)
              from google.adk.models.llm_request import LlmRequest

              request = LlmRequest(
                  contents=[
                      types.Content(
                          role="user",
                          parts=[types.Part.from_text(text="ping")],
                      )
                  ],
              )
              try:
                  async for _ in model.generate_content_async(request):
                      pass
                  print("RESULT: ok")
              except Exception as error:  # noqa: BLE001 -- diagnostic only
                  status = getattr(error, "code", None)
                  print(f"RESULT: {type(error).__name__} status={status}")

          asyncio.run(main())
          PY

